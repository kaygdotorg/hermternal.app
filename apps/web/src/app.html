<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#F3F5F8" />
    <meta
      name="description"
      content="Hermternal web prototype shell with deterministic mock transport."
    />
    <link rel="manifest" href="%sveltekit.assets%/manifest.webmanifest" />
    %sveltekit.head%
  </head>
  <body data-sveltekit-preload-data="hover">
    <div style="display: contents">%sveltekit.body%</div>
    <!-- Static SPA fallback: with scripts disabled, expose only the inert product
         boundary. With scripts enabled, noscript content is not rendered and
         the Svelte route owns the normal pending-to-live lifecycle. -->
    <noscript><main aria-busy="true" aria-label="Starting Hermternal"></main></noscript>
  </body>
</html>
